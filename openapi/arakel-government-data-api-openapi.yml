        price:
          mode: fixed
          currency: USD
          amount: '0.03'
        protocols:
        - x402: {}
      operationId: counterpartyGovernmentCheck
      summary: Counterparty government check
      description: Check one counterparty across OFAC sanctions, FDA recalls, USAspending federal awards, and Federal Register records. Returns one compact signed multi-source verdict.
      tags:
      - government-data
      x-price: $0.03
      x-x402-price: $0.03
      parameters:
      - name: q
        in: query
        required: true
        example: Boeing
        schema:
          type: string
          default: Boeing
          example: Boeing
      - name: from
        in: query
        required: false
        example: '2025-09-03T00:00:00Z'
        schema:
          type: string
          format: date-time
          default: '2025-09-03T00:00:00Z'
          example: '2025-09-03T00:00:00Z'
      - name: to
        in: query
        required: false
        example: '2026-09-03T00:00:00Z'
        schema:
          type: string
          format: date-time
          default: '2026-09-03T00:00:00Z'
          example: '2026-09-03T00:00:00Z'
      responses:
        '200':
          description: Compact signed government counterparty check
        '402':
          description: Payment Required
        '409':
          description: Payment not recommended
